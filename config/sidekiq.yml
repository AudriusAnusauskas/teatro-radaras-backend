:concurrency: 5

:queues:
  - default
  - scrapers
  - mailers

production:
  :concurrency: 10

:scheduler:
  :schedule:
    scrape_catalogs:
      cron: "0 4 * * 1"  # Weekly, Monday 04:00
      class: ScrapeCatalogsJob
      queue: scrapers
      description: "Weekly catalog scrape for all registered theaters"

    scrape_schedules:
      cron: "0 5 * * *"  # Daily 05:00
      class: ScrapeSchedulesJob
      queue: scrapers
      description: "Daily schedule scrape for all registered theaters"

    scrape_reviews:
      cron: "0 6 * * 1"  # Monday 6:00 AM Vilnius time
      class: ScrapeReviewsJob
      queue: scrapers
      description: "Weekly review scrape from 7md.lt and menufaktura.lt"
